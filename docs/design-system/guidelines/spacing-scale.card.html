<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="8pt rhythm — 4 to 64px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .sw { text-align: center; }
  .bar { background: var(--amber); border-radius: 2px; width: 100%; }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); margin-top: 8px; }
  .lbl { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 9px; color: var(--text-hi); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="width:40px"><div class="bar" style="height:4px"></div><div class="lbl">1</div><div class="nm">4</div></div>
    <div class="sw" style="width:40px"><div class="bar" style="height:8px"></div><div class="lbl">2</div><div class="nm">8</div></div>
    <div class="sw" style="width:40px"><div class="bar" style="height:12px"></div><div class="lbl">3</div><div class="nm">12</div></div>
    <div class="sw" style="width:40px"><div class="bar" style="height:16px"></div><div class="lbl">4</div><div class="nm">16</div></div>
    <div class="sw" style="width:48px"><div class="bar" style="height:24px"></div><div class="lbl">5</div><div class="nm">24</div></div>
    <div class="sw" style="width:48px"><div class="bar" style="height:32px"></div><div class="lbl">6</div><div class="nm">32</div></div>
    <div class="sw" style="width:56px"><div class="bar" style="height:48px"></div><div class="lbl">7</div><div class="nm">48</div></div>
    <div class="sw" style="width:64px"><div class="bar" style="height:64px"></div><div class="lbl">8</div><div class="nm">64</div></div>
  </div>
</body>
</html>
