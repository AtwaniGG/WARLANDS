<!-- @dsCard group="Type" viewport="700x180" name="Mono — Geist Mono" subtitle="Tabular numerics · addresses · tx hashes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 22px; }
  .m { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); margin-top: 4px; letter-spacing: 0.04em; }
  .stack > div { margin-bottom: 13px; }
</style>
</head>
<body>
  <div class="stack">
    <div><div class="m" style="font-size:24px;font-weight:600;color:var(--amber-text)">48,210 <span style="font-size:12px;color:var(--text-lo)">$WAR</span></div><div class="meta">resource readout · tabular, won't jitter</div></div>
    <div><div class="m" style="font-size:14px;color:var(--text-hi)">18d 04h 37m</div><div class="meta">season / build timer</div></div>
    <div><div class="m" style="font-size:12px;color:var(--text-lo)">0x7a3f…9c2b · ring 2 · tick 14,920</div><div class="meta">address · debug</div></div>
  </div>
</body>
</html>
