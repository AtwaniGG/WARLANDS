<!-- @dsCard group="Colors" viewport="700x160" name="Command Accents" subtitle="Amber command · blood hostile · teal intel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 152px; }
  .chip { height: 60px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; }
  .role { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; font-weight: 600; }
  .nm { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--text-hi); margin-top: 8px; }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--amber)"><span class="role" style="color:#0c0a04">COMMAND / $WAR</span></div><div class="nm">Amber</div><div class="hx">#F5B301 · --amber</div></div>
    <div class="sw"><div class="chip" style="background:var(--blood)"><span class="role" style="color:#fff">HOSTILE</span></div><div class="nm">Blood</div><div class="hx">#9C2B2B · --blood</div></div>
    <div class="sw"><div class="chip" style="background:var(--teal)"><span class="role" style="color:#04161a">INTEL</span></div><div class="nm">Teal</div><div class="hx">#3F9AA6 · --teal</div></div>
    <div class="sw"><div class="chip" style="background:var(--sky)"><span class="role" style="color:#06121f">ALLY / STAKE</span></div><div class="nm">Sky</div><div class="hx">#4A90D9 · --sky</div></div>
  </div>
</body>
</html>
