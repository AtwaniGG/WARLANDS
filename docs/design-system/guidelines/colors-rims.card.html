<!-- @dsCard group="Colors" viewport="700x140" name="Map Ownership Rims" subtitle="Hex border colors — owned, enemy, selected, neutral" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 120px; text-align: center; }
  .hex { width: 64px; height: 72px; margin: 0 auto; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--panel-2); border: 0; position: relative; }
  .hex::after { content:""; position:absolute; inset:3px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--panel); }
  .nm { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--text-hi); margin-top: 8px; }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="hex" style="background:var(--rim-owned)"></div><div class="nm">Owned</div><div class="hx">#FACC15</div></div>
    <div class="sw"><div class="hex" style="background:var(--rim-selected)"></div><div class="nm">Selected</div><div class="hx">#FFD24A</div></div>
    <div class="sw"><div class="hex" style="background:var(--rim-enemy)"></div><div class="nm">Enemy</div><div class="hx">#DC2626</div></div>
    <div class="sw"><div class="hex" style="background:var(--rim-neutral)"></div><div class="nm">Neutral</div><div class="hx">#1C2433</div></div>
  </div>
</body>
</html>
