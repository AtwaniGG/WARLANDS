<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="../styles.css" />

  .r { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 132px; flex: none; }

</head>
<body>
  <div class="r"><span class="tok">--text-display 48</span><span class="s" style="font-size:48px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:-0.01em">WARLANDS</span></div>
  <div class="r"><span class="tok">--text-3xl 24</span><span class="s" style="font-size:24px;font-weight:700">Claim the Crucible</span></div>

  <div class="r"><span class="tok">--text-md 14</span><span class="s" style="font-size:14px">Scouted garrison strength</span></div>
  <div class="r"><span class="tok">--text-base 13</span><span class="s" style="font-size:13px;color:var(--text-lo)">Balanced starter land. +5% build speed.</span></div>
  <div class="r"><span class="tok">--text-sm 12</span><span class="s" style="font-size:12px;color:var(--text-lo)">Buy fills the cheapest asks</span></div>
