<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Tight 4 / 8 / 12 set + pill for token coins" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; display: flex; gap: 20px; }
  .cell { text-align: center; }
  .box { width: 84px; height: 64px; background: var(--panel-2); border: 1px solid var(--border-strong); }
  .name { font-size: 11px; font-weight: 600; color: var(--text-hi); margin-top: 9px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); margin-top: 2px; }
  .role { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="px">4px</div><div class="role">chips, buttons</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md</div><div class="px">8px</div><div class="role">panels, inputs</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg</div><div class="px">12px</div><div class="role">modals, cards</div></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-pill); width:64px"></div><div class="name">pill</div><div class="px">999px</div><div class="role">coins, bars, dots</div></div>
</body>
</html>
