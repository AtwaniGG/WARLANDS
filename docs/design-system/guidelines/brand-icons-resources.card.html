<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; }
  .cell { text-align: center; }
  .ico { height: 52px; border-radius: var(--radius-md); display: grid; place-items: center; }
  .ico img { width: 34px; height: 34px; display: block; }
  .nm { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 9px; color: var(--text-lo); margin-top: 6px; line-height: 1.15; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/aircraft.svg" alt="aircraft" /></div><div class="nm">Aircraft</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/ammunition.svg" alt="ammunition" /></div><div class="nm">Ammunition</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/buildingComponents.svg" alt="buildingComponents" /></div><div class="nm">Building Components</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/chemicals.svg" alt="chemicals" /></div><div class="nm">Chemicals</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/dataChips.svg" alt="dataChips" /></div><div class="nm">Data Chips</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/drones.svg" alt="drones" /></div><div class="nm">Drones</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/electronics.svg" alt="electronics" /></div><div class="nm">Electronics</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/food.svg" alt="food" /></div><div class="nm">Food</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/fuel.svg" alt="fuel" /></div><div class="nm">Fuel</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/iron.svg" alt="iron" /></div><div class="nm">Iron</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/machineParts.svg" alt="machineParts" /></div><div class="nm">Machine Parts</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/oil.svg" alt="oil" /></div><div class="nm">Oil</div></div>
    <div class="cell"><div class="ico" style="background:var(--panel);border:1px solid var(--hairline);"><img src="../assets/resources/rareMinerals.svg" alt="rareMinerals" /></div><div class="nm">Rare Minerals</div></div>

</html>
