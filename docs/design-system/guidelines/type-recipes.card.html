<!-- @dsCard group="Type" viewport="700x150" name="Text Recipes" subtitle=".wl-label · .wl-title · .wl-num utility classes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cell { background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 16px; }
  .code { font-family: var(--font-mono); font-size: 10px; color: var(--teal-text); margin-top: 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="wl-label">Stockpile · cap 2,000</div><div class="code">.wl-label</div></div>
    <div class="cell"><div class="wl-title" style="font-size:18px">Command Center</div><div class="code">.wl-title</div></div>
    <div class="cell"><div class="wl-num" style="font-size:18px;color:var(--amber-text)">1,240.50</div><div class="code">.wl-num</div></div>
  </div>
</body>
</html>
