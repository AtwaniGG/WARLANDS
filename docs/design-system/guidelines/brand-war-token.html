<!-- @dsCard group="Brand" viewport="700x200" name="$WAR Token & Signal" subtitle="The amber economy signal — coin, CTA, owned land" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; display: flex; align-items: center; gap: 30px; }
  .coin { width: 96px; height: 96px; border-radius: var(--radius-pill); background: radial-gradient(circle at 38% 32%, #ffd24a, var(--amber) 60%, #b8830a); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(245,179,1,0.18), var(--shadow-2); flex: none; }
  .coin span { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: #5a3d00; letter-spacing: -0.02em; }
  .info { flex: 1; }
  .info h3 { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber-text); margin: 0 0 6px; }
  .info p { font-size: 12px; color: var(--text-lo); margin: 0 0 14px; max-width: 360px; line-height: 1.5; }
  .uses { display: flex; gap: 8px; flex-wrap: wrap; }
  .use { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 9px; border-radius: var(--radius-sm); background: rgba(245,179,1,0.12); color: var(--amber-text); border: 1px solid rgba(245,179,1,0.3); }
  .cta { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-sm); background: var(--amber); color: #0c0a04; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
  <div class="coin"><span>$WAR</span></div>
  <div class="info">
    <h3>Amber = the economy signal</h3>
    <p>One high-chroma accent carries all "value": staked land, the $WAR token, primary CTAs and your owned plots. Locked, never spent.</p>
    <div class="uses">
      <span class="use">Owned land</span><span class="use">Primary CTA</span><span class="use">Stake</span><span class="use">Season pool</span>
    </div>
    <div class="cta">⚔️ Stake 10,000 $WAR &amp; Claim</div>
  </div>
</body>
</html>
