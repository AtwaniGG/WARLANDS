<!-- @dsCard group="Brand" viewport="700x240" name="Building Icons" subtitle="Extractors, factories, storage + ★ allegiance structures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--panel-void); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; }
  .cell { text-align: center; }
  .ico { height: 52px; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--panel); border: 1px solid var(--hairline); }
  .ico img { width: 34px; height: 34px; display: block; }
  .nm { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: 8.5px; color: var(--text-lo); margin-top: 6px; line-height: 1.15; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="ico"><img src="../assets/buildings/armsFactory.svg" alt="armsFactory" /></div><div class="nm">Arms Factory</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/camp.svg" alt="camp" /></div><div class="nm">Camp</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/dataExcavator.svg" alt="dataExcavator" /></div><div class="nm">Data Excavator</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/electronicsLab.svg" alt="electronicsLab" /></div><div class="nm">Electronics Lab</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/farm.svg" alt="farm" /></div><div class="nm">Farm</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/foundry.svg" alt="foundry" /></div><div class="nm">Foundry</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/heavyWorks.svg" alt="heavyWorks" /></div><div class="nm">Heavy Works</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/ironMine.svg" alt="ironMine" /></div><div class="nm">Iron Mine</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/lumberCamp.svg" alt="lumberCamp" /></div><div class="nm">Lumber Camp</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/mineralMine.svg" alt="mineralMine" /></div><div class="nm">Mineral Mine</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/oilDerrick.svg" alt="oilDerrick" /></div><div class="nm">Oil Derrick</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/quarry.svg" alt="quarry" /></div><div class="nm">Quarry</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/refinery.svg" alt="refinery" /></div><div class="nm">Refinery</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/warehouse.svg" alt="warehouse" /></div><div class="nm">Warehouse</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/well.svg" alt="well" /></div><div class="nm">Well</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/allegiance/factory.svg" alt="★ factory" /></div><div class="nm">★  factory</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/allegiance/fortress.svg" alt="★ fortress" /></div><div class="nm">★  fortress</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/allegiance/hq.svg" alt="★ hq" /></div><div class="nm">★  hq</div></div>
    <div class="cell"><div class="ico"><img src="../assets/buildings/allegiance/radar.svg" alt="★ radar" /></div><div class="nm">★  radar</div></div>
  </div>
</body>
</html>
