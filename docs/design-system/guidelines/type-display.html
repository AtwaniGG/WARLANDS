<!-- @dsCard group="Type" viewport="700x200" name="Display — Oswald" subtitle="Condensed industrial grotesque · ALL-CAPS labels & titles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; }
  .big { font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: -0.01em; text-transform: uppercase; color: var(--text-hi); line-height: 1; }
  .sub { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber-text); margin-top: 14px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-lo); margin-top: 14px; }
  .labels { display: flex; gap: 18px; margin-top: 14px; }
  .l { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="big">Claim the Crucible</div>
  <div class="sub">Stake · Build · Raid · Rule</div>
  <div class="labels">
    <span class="l">Stockpile</span><span class="l">Train Units</span><span class="l">Construct</span><span class="l">Battle Report</span>
  </div>
  <div class="meta">Oswald — 400 / 500 / 600 / 700 · use uppercase for section labels &amp; hero titles</div>
</body>
</html>
