<!-- @dsCard group="Colors" viewport="700x150" name="Base / Environment" subtitle="The desaturated war world — gunmetal, sand, olive" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--hairline); }
  .chip { height: 52px; }
  .meta { padding: 6px 9px; background: var(--panel); }
  .name { font-size: 11px; font-weight: 600; color: var(--text-hi); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-lo); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--gunmetal)"></div><div class="meta"><div class="name">gunmetal</div><div class="hex">#2a2f3a</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ash)"></div><div class="meta"><div class="name">ash</div><div class="hex">#4b515c</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--olive-drab)"></div><div class="meta"><div class="name">olive-drab</div><div class="hex">#5c6347</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sand)"></div><div class="meta"><div class="name">sand</div><div class="hex">#c9a14a</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--concrete)"></div><div class="meta"><div class="name">concrete</div><div class="hex">#8b8f96</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--dirt-brown)"></div><div class="meta"><div class="name">dirt-brown</div><div class="hex">#6b5840</div></div></div>
</div>
</body>
</html>
