<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark Lockup" subtitle="Black-weight amber wordmark + PROTOTYPE tag" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 0; }
  .stage { display: flex; }
  .panel { flex: 1; display: flex; align-items: center; justify-content: center; height: 200px; gap: 9px; }
  .on-dark { background: var(--panel-void); }
  .on-light { background: var(--sand); }
  .mark { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: -0.01em; text-transform: uppercase; }
  .amber { color: var(--amber); }
  .ink { color: #0c0a04; }
  .tag { font-family: var(--font-ui); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 7px; border-radius: var(--radius-sm); }
  .tag-dark { background: rgba(156,43,43,0.4); color: var(--blood-text); }
  .tag-light { background: rgba(12,10,4,0.15); color: #0c0a04; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stack .sub { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--text-lo); }
</style>
</head>
<body>
<div class="stage">
  <div class="panel on-dark"><span class="mark amber">WARLANDS</span><span class="tag tag-dark">Prototype</span></div>
  <div class="panel on-dark">
    <div class="stack"><span class="mark amber" style="font-size:30px">WARLANDS</span><span class="sub">Web3 Strategy MMO</span></div>
  </div>
  <div class="panel on-light"><span class="mark ink">WARLANDS</span><span class="tag tag-light">Prototype</span></div>
</div>
</body>
</html>
