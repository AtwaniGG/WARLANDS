<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 22px; }
  .block { margin-bottom: 22px; }
  .cap { font-family: var(--font-display); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 9px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { ResourceChip, ProgressBar, Tabs } = window.WARLANDSDesignSystem_e0d283;
  const TABS = [
    { id: "map", label: "World", icon: "🗺️" },
    { id: "market", label: "Market", icon: "💱" },
    { id: "allegiance", label: "Allegiance", icon: "🤝" },
    { id: "season", label: "Season", icon: "🏆" },
  ];

  function Demo() {
    const [view, setView] = React.useState("map");
    return (
      <div>
        <div className="block">
          <div className="cap">Tabs — primary view switcher</div>
          <div style={{border:'1px solid var(--border-default)', borderRadius:'var(--radius-md)', overflow:'hidden'}}>
            <Tabs tabs={TABS} value={view} onChange={setView} />
          </div>
        </div>

        <div className="block">
          <div className="cap">ResourceChip — supply-chain tiers</div>
          <div className="row">
            <ResourceChip icon="🌾" name="Food" amount="1,240" tier="raw" />
            <ResourceChip icon="🛢️" name="Oil" amount="860" tier="raw" />
            <ResourceChip icon="🔩" name="Steel" amount="320" tier="intermediate" />
            <ResourceChip icon="⚙️" name="Machine Parts" amount="74" tier="intermediate" />
            <ResourceChip icon="🛡️" name="Tanks" amount="12" tier="finished" />
            <ResourceChip icon="✈️" name="Aircraft" amount="4" tier="finished" />
          </div>
          <div className="row" style={{marginTop:'8px'}}>
            <ResourceChip icon="💎" amount="×8" size="sm" />
            <ResourceChip icon="🛢️" amount="×120" size="sm" />
            <ResourceChip icon="🔫" amount="×30" size="sm" />
          </div>
        </div>

        <div className="grid2">
          <div>
            <div className="cap">ProgressBar — season / defense</div>
            <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
              <ProgressBar value={62} tone="amber" label="Season 3" valueText="48s left" />
              <ProgressBar value={40} tone="blood" label="Defense" valueText="40%" height={6} />
              <ProgressBar value={78} tone="emerald" label="Production" valueText="+78%" height={6} />
            </div>
          </div>
          <div>
            <div className="cap">Build queue</div>
            <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
              <ProgressBar value={30} tone="sky" label="Tank" valueText="6s" height={6} />
              <ProgressBar value={85} tone="violet" label="Research" valueText="2s" height={6} />
            </div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
